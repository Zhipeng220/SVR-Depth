[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svr-depth"
version = "0.2.0.dev0"
description = "Persistent feature repair for VeloDepth streaming depth propagation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["velodepth*", "svr_depth*"]

[tool.setuptools.package-data]
"velodepth.ops.losses.resources" = ["*.npz"]
"velodepth.ops.knn" = ["compile.sh", "src/*.cu", "src/*.h", "src/*.cpp", "src/utils/*.h", "src/utils/*.cuh"]
"svr_depth._compat" = ["*.zip", "output_smoke/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
